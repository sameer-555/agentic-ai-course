[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-buddy"
version = "0.1.0"
description = "Example code for the Agentic AI course (Levels 1-14 + capstone)"
requires-python = ">=3.10"
# Versions below are the ones these examples were checked against (Oct 2026).
# Agent libraries move fast: if something breaks, compare with these first.
dependencies = [
    "anthropic>=1.12",
    "pydantic>=2.13",
    "python-dotenv>=1.0",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "mcp>=1.30",
    "langchain-mcp-adapters>=0.3",
    "rank-bm25>=0.2.2",
    "fastapi>=0.140",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pytest>=8",
]

[tool.setuptools]
packages = ["ops_buddy"]

[tool.setuptools.package-data]
ops_buddy = ["policies/*.md"]
